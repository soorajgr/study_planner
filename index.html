<!DOCTYPE html>
<html>
  <head>
    <title>Study Planner</title>
    <style>
      body { font-family: Arial; max-width: 400px; margin: 40px auto; }
      li { margin: 8px 0; }
      .task-text { cursor: pointer; }
      .done { text-decoration: line-through; color: grey; }
      .delete-btn { margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>My Study Planner</h1>

    <input type="text" id="taskInput" placeholder="Enter a study task">
    <button id="addButton">Add</button>
    <ul id="taskList"></ul>

    <script>
      const input = document.getElementById("taskInput");
      const button = document.getElementById("addButton");
      const list = document.getElementById("taskList");

      // Load saved tasks (or start with an empty list)
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      function showTasks() {
        list.innerHTML = "";

        tasks.forEach(function (task, index) {
          const item = document.createElement("li");

          const label = document.createElement("span");
          label.textContent = task.text;
          label.className = "task-text";
          if (task.done) label.classList.add("done");

          label.addEventListener("click", function () {
            tasks[index].done = !tasks[index].done;
            saveTasks();
            showTasks();
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.className = "delete-btn";
          deleteBtn.addEventListener("click", function () {
            tasks.splice(index, 1);
            saveTasks();
            showTasks();
          });

          item.appendChild(label);
          item.appendChild(deleteBtn);
          list.appendChild(item);
        });
      }

      button.addEventListener("click", function () {
        const text = input.value;
        if (text === "") return;

        tasks.push({ text: text, done: false });
        saveTasks();
        showTasks();
        input.value = "";
      });

      showTasks();
    </script>
  </body>
</html>
